name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  XDEBUG_MODE: 'off'
  # Locales are turned off for apps; the suite still exercises them.
  SPACEPRESS_LOCALES: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR pushes supersede each other; main runs queue so every merge is proven.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --lib --bins
      - run: cargo test --locked --test kitchen_sink -- --skip kitchen_sink_renders_every_route_on_wordpress
      - name: Install generated PHP layout tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml php-mbstring composer
          composer install --working-dir=examples/php-standards --no-interaction --prefer-dist
      - name: Test PHP comparison tooling
        run: node --test examples/php-standards/compare.test.ts
      - name: Check generated PHP WordPress standards
        run: |
          cargo run --locked --example php-standards -- "$RUNNER_TEMP/php-standards"
          composer --working-dir=examples/php-standards run check -- "$RUNNER_TEMP/php-standards"
  # Three shards in parallel: the compiler suites and the npm comparison (about 26 minutes); the
  # slowest test targets, `slow` (the importer, app_router, sync and wp_plugins);
  # and fmt, clippy, every other test target and the acceptance scripts, `rest`. Test targets
  # come from cargo metadata, so a new one lands in `rest` without a workflow edit. With `slow`
  # inside it, `rest` took 26 to 36 minutes, and four of nine full runs on 2026-11-13 hit the
  # 40-minute limit.
  rust:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [compiler, slow, rest]
    env:
      SHARD: ${{ matrix.shard }}
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
          npm install --global typescript@5.9.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sp/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      # tests/sync.rs serves a WordPress-on-SQLite site (tests/php/wp.php).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      # Migrated apps are type-checked with the standard Node declarations (migrate/tests/app_migrate.rs).
      - run: npm ci --prefix tests/host-types --ignore-scripts --no-audit --no-fund
      # Chromium drives compiled client components on WordPress (tests/app_router.rs).
      - if: matrix.shard == 'slow'
        run: |
          npm ci --prefix tests/differential/client --ignore-scripts --no-audit --no-fund
          npx --prefix tests/differential/client playwright-core install --with-deps chromium-headless-shell
      # React renders the Node half of the TSX parity test (tests/compiler.rs); esbuild compiles it.
      - if: matrix.shard == 'compiler'
        run: npm ci --prefix tests/differential/html --ignore-scripts --no-audit --no-fund
      - if: matrix.shard == 'rest'
        run: cargo fmt --all --check
      - if: matrix.shard == 'rest'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test (${{ matrix.shard }})
        run: |
          compiler=(compiler compiler_contracts)
          slow=(app_router sync wp_plugins)
          if [ "$SHARD" = compiler ]; then
            cargo test --locked "${compiler[@]/#/--test=}"
          elif [ "$SHARD" = slow ]; then
            cargo test --locked "${slow[@]/#/--test=}"
            cargo test --locked -p spacepress-migrate
          else
            rest=()
            for name in $(cargo metadata --no-deps --format-version 1 | jq -r ' .packages[] | select(.name == "spacepress") | .targets[] | select(.kind[] == "test") | .name'); do
              [[ " ${compiler[*]} ${slow[*]} " == *" $name "* ]] || rest+=("--test=$name")
            done
            cargo test --locked --lib --bins "${rest[@]}"
            cargo test --locked --doc
          fi
      - name: Compare real npm library imports with Node
        if: matrix.shard == 'compiler'
        run: |
          npm ci --prefix examples/npm-compat --ignore-scripts --no-audit --no-fund
          SP_BIN="$GITHUB_WORKSPACE/target/debug/spacepress" node examples/npm-compat/verify.mjs --isolated
      # Every app under examples/ compiles (files-sdk, a probe of what doesn't yet, is left out).
      - if: matrix.shard == 'rest'
        run: scripts/check-examples.sh target/debug/spacepress
      # Every example's committed sp/_generated/ (client, db.d.ts, openapi.json, a migration the
      # compiler would add) is what this compiler builds. This job runs after merging, on main;
      # on PRs, runtime/client/committed.test.ts checks only the copied client files.
      - if: matrix.shard == 'rest'
        run: scripts/check-generated.sh target/debug/spacepress
      - name: Migration tool checks
        if: matrix.shard == 'rest'
        env:
          SP_MIGRATE_BIN: ${{ github.workspace }}/target/debug/spacepress-migrate
        run: |
          cargo build --locked -p spacepress-migrate
          node --test migrate/zero/census/census.test.mjs migrate/zero/census/usage.test.mjs
          php migrate/tests/legacy_test.php
      # @spacepress/astro against a SpacePress site on WordPress-on-SQLite, and a real astro build.
      - name: Astro loaders
        if: matrix.shard == 'rest'
        env:
          SP_BIN: ${{ github.workspace }}/target/debug/spacepress
        run: |
          npm ci --prefix packages/astro --ignore-scripts --no-audit --no-fund
          tsc -p packages/astro
          node --test packages/astro/test/loader.test.mjs packages/astro/test/paging.test.mjs packages/astro/test/emdash.test.mjs
      # examples/garden and its Astro twin render the same pages (Chromium from the slow shard's setup).
      - name: Astro twin example
        if: matrix.shard == 'rest'
        env:
          SP_BIN: ${{ github.workspace }}/target/debug/spacepress
        run: |
          npm ci --prefix examples/astro-garden --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/differential/client --ignore-scripts --no-audit --no-fund
          npx --prefix tests/differential/client playwright-core install --with-deps chromium-headless-shell
          node --test examples/astro-garden/twins.test.mjs
      # The migrated Astro fixture, read in Chromium on WordPress.
      - name: Migrated Astro example
        if: matrix.shard == 'rest'
        env:
          SP_BIN: ${{ github.workspace }}/target/debug/spacepress
        run: |
          npm ci --prefix tests/differential/client --ignore-scripts --no-audit --no-fund
          npx --prefix tests/differential/client playwright-core install --with-deps chromium-headless-shell
          node --test migrate/astro/example/migrated.test.mjs
      - name: Scaffolder on WordPress
        if: matrix.shard == 'rest'
        env:
          SP_BIN: ${{ github.workspace }}/target/debug/spacepress
        run: npm test --prefix packages/create-spacepress
      - name: Docker-free local development acceptance
        if: matrix.shard == 'rest'
        run: node --test scripts/dev/acceptance.test.mjs
      - name: Offline deployment and recovery acceptance
        if: matrix.shard == 'rest'
        env:
          SP_DEPLOY_BIN: ${{ github.workspace }}/target/debug/spacepress
        run: node --test scripts/deploy/artifact.test.mjs scripts/deploy/wordpress.test.mjs

  # Each example's own test against real WordPress (Studio, through `spacepress dev`): the HTTP
  # verifiers and the EmDash counterparts. check-examples.sh above
  # only compiles them. Port 8940 is the runner's own; the frontend of official-sites uses 8941.
  examples:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SP_BIN: ${{ github.workspace }}/target/debug/spacepress
      SP_EXAMPLE_PORT: '8940'
      SP_EXAMPLE_FRONTEND_PORT: '8941'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The official-source suite needs Node.js 22.23.4 or newer (examples/emdash/test.mjs).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - run: cargo build --locked --bin spacepress
      # The files-sdk probe runs nightly in files-sdk.yml: with --expect-red it reports rather than
      # gates, and it took most of this job.
      - name: Example HTTP verifiers on WordPress
        run: node scripts/check-example-runs.mjs
      - name: EmDash counterparts on WordPress
        run: node examples/emdash/test.mjs publishing agents platform official-source
      - name: Subscriptions calendar
        run: node --test examples/subscriptions/sp/lib/calendar.test.mjs

  www:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLUGINS_URL: http://localhost:8960
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          npm install --global bun@1.3.14 typescript@5.9.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-www-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sp/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: npm run build --prefix www
      - run: tsc --project www/tsconfig.json
      - run: node scripts/check-www-examples.mjs
      - run: bun x --no-install playwright-core install --with-deps chromium-headless-shell
        working-directory: www
      - run: npm test --prefix www

  host:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --target x86_64-unknown-linux-musl --target wasm32-unknown-unknown
      - run: cargo build --locked --no-default-features --features host --target x86_64-unknown-linux-musl
      - run: cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --lib --no-default-features --profile wasm --target wasm32-unknown-unknown
      - run: cargo build --locked --bin spacepress
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: node --test tests/wasm/host.test.mjs

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
      # WordPress core and the pinned plugins the in-process suites boot (tests/php/wp.php), pinned by SHA-256.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      - run: tests/php/run.sh

  vendor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: php:8.2-cli
    steps:
      - name: Install maintainer toolchain
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libonig-dev
          docker-php-ext-install mbstring
          curl -fsSL https://getcomposer.org/download/2.10.3/composer.phar -o /usr/local/bin/composer
          echo '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /usr/local/bin/composer' | sha256sum -c -
          chmod +x /usr/local/bin/composer
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Regenerate prefixed dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/vendor.sh all
      - name: Check regenerated trees
        run: |
          git diff --exit-code -- ':(glob)**/vendor-prefixed/**'
          untracked=$(git ls-files --others --exclude-standard -- ':(glob)**/vendor-prefixed/**')
          if [ -n "$untracked" ]; then
            printf 'Untracked generated bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  # The admin screens: typecheck, unit tests, and a rebuild that must match the committed bundle.
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/admin/apps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      # Corepack reads the pinned pnpm from this directory's packageManager field.
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('runtime/admin/apps/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify retained upstream admin sources
        working-directory: ${{ github.workspace }}
        run: node --test tests/wp/admin/upstream-drift.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the committed bundle
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code -- runtime/admin/build
          untracked=$(git ls-files --others -- runtime/admin/build)
          if [ -n "$untracked" ]; then
            printf 'Untracked admin bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global typescript@5.9.3
      - run: npm ci --prefix tests/host-types --ignore-scripts --no-audit --no-fund
      - run: tsc -p tests/host-types
      - run: tsc -p types/spacepress/tests
      # The WordPress hook catalog and its declarations match the pinned sources.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/catalog
          key: wordpress-catalog-${{ hashFiles('scripts/wordpress-catalog.py') }}
      - run: python3 scripts/wordpress-catalog.py --check
      - run: tsc -p examples/pantry
      - run: tsc -p examples/kitchen-sink
      - run: tsc -p examples/blog
      - run: tsc -p examples/showcase
      - run: tsc -p examples/blog/client-tests
      - run: node --test runtime/client/*.test.ts
      - run: node --test examples/showcase/build-app.test.mjs examples/showcase/rebuild-service.test.mjs
      - run: node --test scripts/dev/studio.test.mjs
      - run: node --test packages/cli/test/*.test.mjs packages/create-spacepress/test/*.test.mjs scripts/release/archive.test.mjs

  wp:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sp/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: runtime/admin/apps
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: runtime/admin/apps
      # The React hooks test (tests/wp/hooks.test.ts) drives the headless shell through playwright-core.
      - run: npx --yes playwright-core@1.62.1 install chromium-headless-shell
      # Main suites and the native admin journey, on one stack. The migration and S3 lanes run as
      # their own jobs below: on one runner the three together reached the 40-minute limit.
      - run: tests/wp/run.sh
      - name: Verify upstream two-user collaborative editing
        run: tests/wp/coediting/run.sh
      - name: Preserve failed native admin browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp-admin-browser-${{ github.run_attempt }}
          path: /tmp/spacepress-admin-browser
          if-no-files-found: ignore
          retention-days: 7

  wp-migrate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sp/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: cargo build --locked --workspace
      - name: Source, content and account imports
        run: SP_WP_PROJECT=spacepress-wp-migrate SP_WP_PORT=8794 migrate/tests/wp/migrate-run.sh
      - name: Documented import workflow
        run: SP_WP_PROJECT=spacepress-wp-import-system SP_WP_PORT=8809 migrate/tests/wp/legacy/system-run.sh
      - name: Spacefast cross-prefix content and account import
        run: SP_WP_PROJECT=spacepress-wp-spacefast SP_WP_PORT=8892 migrate/tests/wp/legacy/spacefast-run.sh

  # Schema checks, seeding, outbound fetch and WordPress abilities: split from wp-migrate, which
  # ran past its timeout once both halves shared one runner.
  # Two halves of the lanes on separate runners; run one after another they outgrew the timeout.
  wp-schema:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lanes: [schema, store]
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sp/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: cargo build --locked --bin spacepress
      - name: Deploy-time schema check against live rows
        if: matrix.lanes == 'schema'
        run: SP_WP_PROJECT=spacepress-wp-schema-check SP_WP_PORT=8902 tests/wp/schema-check/run.sh
      - name: SpacePress-publish seed and sync adoption
        if: matrix.lanes == 'schema'
        run: SP_WP_PROJECT=spacepress-wp-seed SP_WP_PORT=8897 tests/wp/seed-run.sh
      - name: Outbound fetch with SSRF refusals
        if: matrix.lanes == 'schema'
        run: SP_WP_PROJECT=spacepress-wp-fetch SP_WP_PORT=8899 tests/wp/fetch/run.sh
      - name: WordPress abilities and wp-hooks from TypeScript
        if: matrix.lanes == 'schema'
        run: SP_WP_PROJECT=spacepress-wp-wordpress SP_WP_PORT=8898 tests/wp/wordpress/run.sh
      - name: Opinionated WordPress hardening, and stock WordPress without an app
        if: matrix.lanes == 'schema'
        run: SP_WP_PROJECT=spacepress-wp-hardening SP_WP_PORT=8896 tests/wp/hardening/run.sh
      - name: Sealed mode on its own stack
        if: matrix.lanes == 'store'
        run: SP_WP_PROJECT=spacepress-wp-sealed SP_WP_PORT=8895 tests/wp/hardening/sealed-run.sh
      - name: Build store, managed initialize, and inspecting a candidate without changing the site
        if: matrix.lanes == 'store'
        run: SP_WP_PROJECT=spacepress-wp-store SP_WP_PORT=8901 tests/wp/store-run.sh
      - name: A managed build installs only from initialize, and installs what plugins install on boot
        if: matrix.lanes == 'store'
        run: SP_WP_PROJECT=spacepress-wp-store-install SP_WP_PORT=8903 tests/wp/store-install-run.sh
      - name: The SpacePress plugin on a stock WordPress, with spacepress login and spacepress push
        if: matrix.lanes == 'store'
        run: SP_WP_PROJECT=spacepress-wp-plugin SP_WP_PORT=8905 tests/wp/plugin/run.sh
      - name: The SpacePress plugin on a WordPress network, one app per site
        if: matrix.lanes == 'store'
        run: SP_WP_PROJECT=spacepress-wp-plugin-ms SP_WP_PORT=8907 tests/wp/plugin/multisite-run.sh

  wp-s3:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sp/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - name: Shared S3 storage across disposable replicas
        run: SP_WP_PROJECT=spacepress-wp-s3 SP_WP_PORT=8792 SP_WP_REPLICA_PORT=8793 tests/wp/run.sh --s3

  # Hosted spacepress/app pages, client components in Chromium and route.ts handlers, from `spacepress compile-sources`.
  wp-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .sp/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: cargo build --locked --bin spacepress
      - name: Hosted pages, client components, action and HTTP routes from compile-sources
        run: |
          npm ci --prefix tests/differential/client --ignore-scripts --no-audit --no-fund
          npx --prefix tests/differential/client playwright-core install --with-deps chromium-headless-shell
          SP_WP_PROJECT=spacepress-wp-pages SP_WP_PORT=8873 tests/wp/hosted-pages-run.sh

  # `spacepress dev` from a release binary after removing its build checkout.
  installed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sp/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/wp/installed/run.sh

  system:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.sp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sp/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/system/run.sh

  identity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Identity acceptance on PHP ${{ matrix.php }}
        env:
          IDENTITY_WORDPRESS_IMAGE: wordpress:7.1.0-php${{ matrix.php }}-apache
          IDENTITY_CLI_IMAGE: wordpress:cli-php${{ matrix.php }}
        run: tests/identity/run.sh
