name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  XDEBUG_MODE: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
          npm install --global typescript@5.9.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      # tests/sync.rs serves a WordPress-on-SQLite site (tests/php/wp.php).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
      # WordPress core and the pinned plugins the in-process suites boot (tests/php/wp.php), pinned by SHA-256.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      - run: tests/php/run.sh

  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: php:8.2-cli
    steps:
      - name: Install maintainer toolchain
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libonig-dev
          docker-php-ext-install mbstring
          curl -fsSL https://getcomposer.org/download/2.10.3/composer.phar -o /usr/local/bin/composer
          echo '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /usr/local/bin/composer' | sha256sum -c -
          chmod +x /usr/local/bin/composer
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Regenerate prefixed dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/vendor.sh all
      - name: Check regenerated trees
        run: |
          git diff --exit-code -- ':(glob)**/vendor-prefixed/**'
          untracked=$(git ls-files --others --exclude-standard -- ':(glob)**/vendor-prefixed/**')
          if [ -n "$untracked" ]; then
            printf 'Untracked generated bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  # The admin screens: typecheck, unit tests, and a rebuild that must match the committed bundle.
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/admin/apps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Corepack reads the pinned pnpm from this directory's packageManager field.
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('runtime/admin/apps/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the committed bundle
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code -- runtime/admin/build
          untracked=$(git ls-files --others --exclude-standard -- runtime/admin/build)
          if [ -n "$untracked" ]; then
            printf 'Untracked admin bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global typescript@5.9.3
      - run: tsc -p types/zero/tests
      - run: tsc -p examples/pantry
      - run: tsc -p examples/blog
      - run: tsc -p examples/blog/client-tests
      - run: node --test runtime/client/index.test.ts

  wp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-mbstring rsync
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zero/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/wp/run.sh

  # `zero dev` from a release binary outside the checkout (its embedded harness).
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-mbstring rsync
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/wp/installed/run.sh

  system:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/system/run.sh

  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Identity acceptance on PHP ${{ matrix.php }}
        env:
          IDENTITY_WORDPRESS_IMAGE: wordpress:7.1-php${{ matrix.php }}-apache
          IDENTITY_CLI_IMAGE: wordpress:cli-php${{ matrix.php }}
        run: tests/identity/run.sh
