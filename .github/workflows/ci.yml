name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  XDEBUG_MODE: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR pushes supersede each other; main runs queue so every merge is proven.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib
  # Two shards in parallel: the compiler suites and the npm comparison (about 26 minutes), and
  # fmt, clippy and every other test target (about 20). Test targets come from cargo metadata,
  # so a new one lands in `rest` without a workflow edit.
  rust:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [compiler, rest]
    env:
      SHARD: ${{ matrix.shard }}
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
          npm install --global typescript@5.9.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      # tests/sync.rs serves a WordPress-on-SQLite site (tests/php/wp.php).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      # Migrated apps are type-checked with the standard Node declarations (tests/app_migrate.rs).
      - run: npm ci --prefix tests/host-types --ignore-scripts --no-audit --no-fund
      - if: matrix.shard == 'rest'
        run: cargo fmt --check
      - if: matrix.shard == 'rest'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (${{ matrix.shard }})
        run: |
          compiler=(compiler compiler_contracts)
          if [ "$SHARD" = compiler ]; then
            cargo test --locked "${compiler[@]/#/--test=}"
          else
            rest=()
            for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].targets[] | select(.kind[] == "test") | .name'); do
              [[ " ${compiler[*]} " == *" $name "* ]] || rest+=("--test=$name")
            done
            cargo test --locked --lib --bins "${rest[@]}"
            cargo test --locked --doc
          fi
      - name: Compare real npm library imports with Node
        if: matrix.shard == 'compiler'
        run: |
          npm ci --prefix examples/npm-compat --ignore-scripts --no-audit --no-fund
          ZERO_BIN="$GITHUB_WORKSPACE/target/debug/zero" node examples/npm-compat/verify.mjs --isolated
      - if: matrix.shard == 'rest'
        run: target/debug/zero check examples/showcase
      - name: Zero 0.8 census tool
        if: matrix.shard == 'rest'
        env:
          ZERO_BIN: ${{ github.workspace }}/target/debug/zero
        run: node --test scripts/census-08/census.test.mjs scripts/census-08/usage.test.mjs
      - name: Docker-free local development acceptance
        if: matrix.shard == 'rest'
        run: node --test scripts/dev/acceptance.test.mjs
      - name: Offline deployment and recovery acceptance
        if: matrix.shard == 'rest'
        env:
          ZERO_DEPLOY_BIN: ${{ github.workspace }}/target/debug/zero
        run: node --test scripts/deploy/artifact.test.mjs scripts/deploy/wordpress.test.mjs

  host:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --target x86_64-unknown-linux-musl --target wasm32-unknown-unknown
      - run: cargo build --locked --no-default-features --features host --target x86_64-unknown-linux-musl
      - run: cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --lib --no-default-features --profile wasm --target wasm32-unknown-unknown
      - run: cargo build --locked --bin zero
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node --test tests/wasm/host.test.mjs

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
      # WordPress core and the pinned plugins the in-process suites boot (tests/php/wp.php), pinned by SHA-256.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/*.zip
          key: wp-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json', 'tests/php/wp.php') }}
      - run: tests/php/run.sh

  vendor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: php:8.2-cli
    steps:
      - name: Install maintainer toolchain
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libonig-dev
          docker-php-ext-install mbstring
          curl -fsSL https://getcomposer.org/download/2.10.3/composer.phar -o /usr/local/bin/composer
          echo '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /usr/local/bin/composer' | sha256sum -c -
          chmod +x /usr/local/bin/composer
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Regenerate prefixed dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/vendor.sh all
      - name: Check regenerated trees
        run: |
          git diff --exit-code -- ':(glob)**/vendor-prefixed/**'
          untracked=$(git ls-files --others --exclude-standard -- ':(glob)**/vendor-prefixed/**')
          if [ -n "$untracked" ]; then
            printf 'Untracked generated bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  # The admin screens: typecheck, unit tests, and a rebuild that must match the committed bundle.
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/admin/apps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Corepack reads the pinned pnpm from this directory's packageManager field.
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('runtime/admin/apps/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify retained upstream admin sources
        working-directory: ${{ github.workspace }}
        run: node --test tests/wp/admin/upstream-drift.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the committed bundle
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code -- runtime/admin/build
          untracked=$(git ls-files --others -- runtime/admin/build)
          if [ -n "$untracked" ]; then
            printf 'Untracked admin bundle files:\n%s\n' "$untracked"
            exit 1
          fi

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global typescript@5.9.3
      - run: npm ci --prefix tests/host-types --ignore-scripts --no-audit --no-fund
      - run: tsc -p tests/host-types
      - run: tsc -p types/zero/tests
      # The WordPress hook catalog and its declarations match the pinned sources.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/wp/cache/catalog
          key: wordpress-catalog-${{ hashFiles('scripts/wordpress-catalog.py') }}
      - run: python3 scripts/wordpress-catalog.py --check
      - run: tsc -p examples/pantry
      - run: tsc -p examples/blog
      - run: tsc -p examples/showcase
      - run: tsc -p examples/blog/client-tests
      - run: node --test runtime/client/index.test.ts
      - run: node --test examples/showcase/build-app.test.mjs examples/showcase/rebuild-service.test.mjs
      - run: node --test scripts/dev/studio.test.mjs
      - run: node --test packages/cli/test/*.test.mjs packages/create-zero/test/*.test.mjs scripts/release/archive.test.mjs

  pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: corepack enable
      # The pages build reads the example's compiled schema, so the compiler builds it first.
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - run: cargo build --locked --bin zero
      - run: target/debug/zero build examples/full-site
      - run: pnpm install --frozen-lockfile
        working-directory: packages/blocks
      - run: pnpm build
        working-directory: packages/blocks
      - run: pnpm install --frozen-lockfile
        working-directory: packages/pages
      - run: pnpm check
        working-directory: packages/pages
      - name: The committed render artifact is current
        run: |
          (cd packages/pages && pnpm build)
          node packages/pages/bin/zero-pages.mjs build examples/full-site
          git diff --exit-code examples/full-site/zero/pages.json
      - run: pnpm test:package
        working-directory: packages/pages
      - run: npx --yes playwright-core@1.62.1 install --with-deps chromium-headless-shell
      - run: pnpm test:wp
        working-directory: packages/pages
        env:
          ZERO_BIN: ${{ github.workspace }}/target/debug/zero

  wp:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zero/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: runtime/admin/apps
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: runtime/admin/apps
      # Main suites and the native admin journey, on one stack. The migration and S3 lanes run as
      # their own jobs below: on one runner the three together reached the 40-minute limit.
      - run: tests/wp/run.sh
        env:
          ZERO_WP_SKIP_MIGRATE: '1'
      - name: Preserve failed native admin browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp-admin-browser-${{ github.run_attempt }}
          path: /tmp/zero-admin-browser
          if-no-files-found: ignore
          retention-days: 7

  wp-migrate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zero/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      # The app migration lane renders converted static pages with packages/pages, built with pnpm.
      - run: corepack enable
      - run: cargo build --locked --bin zero
      - name: Zero 0.8 site, app-user and application migrations
        run: ZERO_WP_PROJECT=zero-wp-migrate ZERO_WP_PORT=8794 tests/wp/migrate-run.sh
      - name: Spacefast cross-prefix migration and session continuity
        run: ZERO_WP_PROJECT=zero-wp-spacefast ZERO_WP_PORT=8892 tests/wp/legacy/spacefast-run.sh
      - name: Deploy-time schema check against live rows
        run: ZERO_WP_PROJECT=zero-wp-schema-check ZERO_WP_PORT=8902 tests/wp/schema-check/run.sh
      - name: First-publish seed and sync adoption
        run: ZERO_WP_PROJECT=zero-wp-seed ZERO_WP_PORT=8897 tests/wp/seed-run.sh
      - name: Outbound fetch with SSRF refusals
        run: ZERO_WP_PROJECT=zero-wp-fetch ZERO_WP_PORT=8899 tests/wp/fetch/run.sh
      - name: WordPress abilities and wp-hooks from TypeScript
        run: ZERO_WP_PROJECT=zero-wp-wordpress ZERO_WP_PORT=8898 tests/wp/wordpress/run.sh

  wp-s3:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zero/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - name: Shared S3 storage across disposable replicas
        run: ZERO_WP_PROJECT=zero-wp-s3 ZERO_WP_PORT=8792 ZERO_WP_REPLICA_PORT=8793 tests/wp/run.sh --s3

  # Hosted TSX pages, the island in Chromium and custom HTTP routes, from `zero compile-sources`.
  wp-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zero/cache/plugins
            tests/wp/cache
          key: wp-plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: corepack enable
      - run: cargo build --locked --bin zero
      - name: Hosted pages, island, action and HTTP routes from compile-sources
        run: |
          (cd packages/blocks && pnpm install --frozen-lockfile && pnpm build)
          (cd packages/pages && pnpm install --frozen-lockfile)
          npx --yes playwright-core@1.62.1 install --with-deps chromium-headless-shell
          ZERO_WP_PROJECT=zero-wp-pages ZERO_WP_PORT=8873 tests/wp/hosted-pages-run.sh

  # `zero dev` from a release binary after removing its build checkout.
  installed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/wp/installed/run.sh

  system:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_WP_PLUGIN_CACHE: ${{ github.workspace }}/.zero/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl
          sudo update-alternatives --set php /usr/bin/php8.3
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zero/cache/plugins
          key: plugins-${{ runner.os }}-${{ hashFiles('tests/fixtures/platform.json') }}
      - run: tests/system/run.sh

  identity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Identity acceptance on PHP ${{ matrix.php }}
        env:
          IDENTITY_WORDPRESS_IMAGE: wordpress:7.1-php${{ matrix.php }}-apache
          IDENTITY_CLI_IMAGE: wordpress:cli-php${{ matrix.php }}
        run: tests/identity/run.sh
