# Release binaries: `zero` for five platforms and the wasm compiler core, packaged for npm the way
# esbuild ships (npm/README.md). Package names live in npm/targets.json.
#
# Pull requests that touch the packaging and manual runs build, pack and install every package on
# its own platform; nothing is published. Publishing happens only for a `v<Cargo.toml version>` tag,
# through the `npm` environment and its NPM_TOKEN secret.
name: Release

on:
  pull_request:
    paths:
      - 'npm/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    name: binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-15 }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the target matches npm/targets.json
        shell: bash
        run: test "$(jq -r '.targets["${{ matrix.platform }}"]' npm/targets.json)" = "${{ matrix.target }}"
      - shell: bash
        run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      # Linux builds link musl statically, so one binary runs on every distribution.
      - shell: bash
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=.exe
          mkdir dist
          cp "target/${{ matrix.target }}/release/zero$exe" "dist/zero-${{ matrix.platform }}$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-wasm-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      # The same build site/scripts/build-wasm.mjs runs for the website.
      - run: |
          cargo build --locked --lib --no-default-features --profile wasm --target wasm32-unknown-unknown
          mkdir dist
          cp target/wasm32-unknown-unknown/wasm/zero.wasm dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-wasm
          path: dist/zero.wasm
          if-no-files-found: error

  pack:
    needs: [binary, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zero-*
          path: artifacts
          merge-multiple: true
      - run: |
          node npm/stage.mjs --artifacts artifacts --out staged
          mkdir packed
          for dir in staged/*/; do (cd "$dir" && npm pack --pack-destination ../../packed); done
          ls -l packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: packed/*.tgz
          if-no-files-found: error

  # Installs the packed wrapper and its platform package on each platform and runs them.
  smoke:
    name: smoke (${{ matrix.runner }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packed
      - run: node npm/smoke.mjs packed

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packed
      # Platform packages first, so the wrapper never points at a version that is not there yet.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          wrapper=$(jq -r .package npm/targets.json | sed 's/^@//; s#/#-#')
          for tgz in packed/*.tgz; do
            case "$(basename "$tgz")" in "$wrapper"-[0-9]*) continue ;; esac
            npm publish "$tgz" --access public --provenance
          done
          npm publish packed/"$wrapper"-[0-9]*.tgz --access public --provenance
