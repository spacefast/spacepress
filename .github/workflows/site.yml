# The website (site/): the compiler core built for the browser, the Astro pages, the parity and
# browser tests. Path-filtered like blocks.yml; pushes to main also deploy to GitHub Pages.
name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'runtime/First/**'
      - 'runtime/wp-plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - 'examples/**'
      - 'tests/fixtures/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'runtime/First/**'
      - 'runtime/wp-plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - 'examples/**'
      - 'tests/fixtures/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/site.yml'

permissions:
  contents: read
  # configure-pages reads the Pages URL so the build knows its origin and base path.
  pages: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: site-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # The core must build without the cli feature: no file system, network or embedded runtime.
      - run: cargo clippy --locked --all-targets --no-default-features --target wasm32-unknown-unknown -- -D warnings
      # The parity tests compare the browser build with the native `first check --json`.
      - run: cargo build --locked --release
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - id: pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://first.spacefast.com' }}
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - run: pnpm typecheck
        working-directory: site
      - run: pnpm test
        working-directory: site
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      - run: pnpm test:browser
        working-directory: site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site/dist

  deploy:
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
