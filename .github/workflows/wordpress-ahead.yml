name: WordPress ahead

# TypedPress against the WordPress that is coming, not only the floor it supports (7.2-beta5): the nightly build,
# and the newest beta or release candidate when there is one. Weekly and by hand only, never on a PR:
# a change in core must not turn every PR red. A failure names the build and each failing test in
# the job summary; docs/wordpress-internals.md says what to look at in core.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      report:
        description: Open, update or close the tracking issue as a scheduled run does
        type: boolean
        default: false
  # TEMPORARY, removed before the PR is ready: proves the issue opens on a failing run and closes on a green one.
  push:
    branches: [tp/wordpress-ahead-issue]

permissions:
  contents: read

env:
  XDEBUG_MODE: 'off'

concurrency:
  group: wordpress-ahead
  cancel-in-progress: false

jobs:
  builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # nightly: wordpress.org's nightly ZIP. next: the newest beta or RC while one is out
      # (api.wordpress.org's `beta` channel offers it as `development`; between cycles it offers none).
      - id: pick
        run: |
          set -euo pipefail
          builds='[{"name":"nightly","url":"https://wordpress.org/nightly-builds/wordpress-latest.zip"},{"name":"broken","url":"https://wordpress.org/latest.tar.gz"}]'  # TEMPORARY failing entry
          offers=$(curl -fsS 'https://api.wordpress.org/core/version-check/1.7/?channel=beta')
          next=$(jq -r '[.offers[] | select(.response == "development") | .download | select(test("/release/wordpress-[0-9.]+-(beta|RC)[0-9]+\\.zip$"))] | first // empty' <<<"$offers")
          if [ -n "$next" ]; then
            builds=$(jq -c --arg url "$next" '. + [{"name":"next","url":$url}]' <<<"$builds")
          fi
          echo "matrix=$builds" >> "$GITHUB_OUTPUT"
          echo "Builds: $builds"

  php:
    name: php (${{ matrix.build.name }})
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.builds.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install PHP extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-gd php8.3-curl php8.3-zip
          sudo update-alternatives --set php /usr/bin/php8.3
      - name: Download ${{ matrix.build.name }}
        id: core
        uses: ./.github/actions/wordpress-build
        with:
          url: ${{ matrix.build.url }}
          name: ${{ matrix.build.name }}
      - name: In-process suites (tests/php)
        run: tests/php/run.sh 2>&1 | tee "$RUNNER_TEMP/php.log"
        env:
          TP_WP_CORE_ZIP: ${{ steps.core.outputs.zip }}
          TP_WP_CORE_SHA256: ${{ steps.core.outputs.sha256 }}
      - name: Summary
        if: always()
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/report/php-${{ matrix.build.name }}.md" .github/actions/wordpress-build/summary.sh "${{ matrix.build.name }}" "${{ steps.core.outputs.version }}" php "$RUNNER_TEMP/php.log"
          echo "${{ job.status }}" > "$RUNNER_TEMP/report/php-${{ matrix.build.name }}.status"
      - name: Keep the summary for the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-php-${{ matrix.build.name }}
          path: ${{ runner.temp }}/report
          retention-days: 7

  wp:
    name: wp (${{ matrix.build.name }})
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.builds.outputs.matrix) }}
    env:
      TP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.tp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: runtime/admin/apps
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: runtime/admin/apps
      - run: npx --yes playwright-core@1.62.1 install chromium-headless-shell
      - name: Download ${{ matrix.build.name }}
        id: core
        uses: ./.github/actions/wordpress-build
        with:
          url: ${{ matrix.build.url }}
          name: ${{ matrix.build.name }}
      # The main WordPress lane (the facade included) on this build of core.
      - name: WordPress lane (tests/wp)
        run: tests/wp/run.sh 2>&1 | tee "$RUNNER_TEMP/wp.log"
        env:
          TP_WP_SKIP_MIGRATE: '1'
          TP_WP_CORE_ZIP: ${{ steps.core.outputs.zip }}
      - name: Summary
        if: always()
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/report/wp-${{ matrix.build.name }}.md" .github/actions/wordpress-build/summary.sh "${{ matrix.build.name }}" "${{ steps.core.outputs.version }}" wp "$RUNNER_TEMP/wp.log"
          echo "${{ job.status }}" > "$RUNNER_TEMP/report/wp-${{ matrix.build.name }}.status"
      - name: Keep the summary for the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-wp-${{ matrix.build.name }}
          path: ${{ runner.temp }}/report
          retention-days: 7

  wp-schema:
    name: wp-schema (${{ matrix.build.name }})
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.builds.outputs.matrix) }}
    env:
      TP_WP_PLUGIN_CACHE: ${{ github.workspace }}/.tp/cache/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain', 'Cargo.lock') }}
      - run: cargo build --locked --bin typedpress
      - name: Download ${{ matrix.build.name }}
        id: core
        uses: ./.github/actions/wordpress-build
        with:
          url: ${{ matrix.build.url }}
          name: ${{ matrix.build.name }}
      # The same lanes as ci.yml's wp-schema job, each on this build of core. Every lane runs even
      # when one fails, so the summary lists them all.
      - name: Schema, seed, fetch, abilities, hardening and sealed lanes
        env:
          TP_WP_CORE_ZIP: ${{ steps.core.outputs.zip }}
        run: |
          status=0
          : > "$RUNNER_TEMP/wp-schema.log"
          for lane in "schema-check/run.sh typedpress-wp-schema-check 8902" "seed-run.sh typedpress-wp-seed 8897" "fetch/run.sh typedpress-wp-fetch 8899" \
                      "wordpress/run.sh typedpress-wp-wordpress 8898" "hardening/run.sh typedpress-wp-hardening 8896" "hardening/sealed-run.sh typedpress-wp-sealed 8895"; do
            read -r script project port <<<"$lane"
            echo "::group::tests/wp/$script"
            TP_WP_PROJECT=$project TP_WP_PORT=$port "tests/wp/$script" 2>&1 | tee -a "$RUNNER_TEMP/wp-schema.log" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Summary
        if: always()
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/report/wp-schema-${{ matrix.build.name }}.md" .github/actions/wordpress-build/summary.sh "${{ matrix.build.name }}" "${{ steps.core.outputs.version }}" wp-schema "$RUNNER_TEMP/wp-schema.log"
          echo "${{ job.status }}" > "$RUNNER_TEMP/report/wp-schema-${{ matrix.build.name }}.status"
      - name: Keep the summary for the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-wp-schema-${{ matrix.build.name }}
          path: ${{ runner.temp }}/report
          retention-days: 7

  # One issue tracks WordPress ahead: opened (or updated) by a failing scheduled run, closed by the
  # next green one. Nobody is assigned or mentioned; the issue is where a failure is visible.
  report:
    needs: [builds, php, wp, wp-schema]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.report)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A job's permissions replace the workflow's: checkout still needs to read the repository.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: report-*
          path: ${{ runner.temp }}/report
          merge-multiple: true
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/actions/wordpress-build/report.sh "$RUNNER_TEMP/report"
