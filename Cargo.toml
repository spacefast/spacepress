[package]
name = "zero"
version = "0.2.0"
edition = "2024"
# The compiler sources are MIT. The package also contains the GPL-2.0-or-later
# PHP runtime embedded by build.rs; LICENSE at the root maps every path.
license = "MIT AND GPL-2.0-or-later"
description = "Compiles zero.config.ts into a PHP backend: migrations, REST, auth, a typed client and WordPress plugins"
repository = "https://github.com/spacefast/zero"

[dependencies]
indexmap = "2.14.2"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
oxc_syntax = "=0.152.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["rustls"] }
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
