minimumReleaseAgeExclude:
  - blume@2.2.7
# @wp-playground/cli's file locking ships prebuilt binaries; its install script only checks that one
# loads, falling back to node-gyp. The Playground boot test runs without it.
allowBuilds:
  fs-ext-extra-prebuilt: false
# async-lock 1.5.0 (2026-11-08) is days old and from a new publisher; 1.4.1 satisfies isomorphic-git's ^1.4.1.
overrides:
  async-lock: 1.4.1
