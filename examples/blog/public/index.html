<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 0; } .tagline { color: #666; margin-top: .25rem; }
    article { border-top: 1px solid #ddd; padding: 1rem 0; } .meta { color: #666; font-size: .875rem; }
    form { display: grid; gap: .5rem; margin-top: .5rem; } textarea { min-height: 4rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header><h1 id="title">Blog</h1><p class="tagline" id="tagline"></p></header>
  <main id="posts"><p>Loading…</p></main>
  <script type="module">
    // The generated typed client, type-stripped to JS by `node build-client.mjs` (no bundler).
    import { createClient, ZeroError } from "./client/index.js";

    const zero = createClient({ url: "/api" });
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    async function render() {
      const settings = await zero.globals.settings.get();
      document.title = $("title").textContent = settings.siteTitle;
      $("tagline").textContent = settings.tagline ?? "";
      const posts = await zero.posts.list({ orderBy: { publishedAt: "desc" }, limit: settings.postsPerPage, with: { author: true, comments: true, cover: true } });
      $("posts").innerHTML = posts.length === 0 ? "<p>No posts yet.</p>" : posts.map((p) => `
        <article>
          ${p.cover ? `<img src="${esc(p.cover.url)}" alt="${esc(p.cover.alt)}" width="${p.cover.width}">` : ""}
          <h2>${esc(p.title)}</h2>
          <p class="meta">${esc(p.author?.name ?? "Anonymous")} · ${new Date(p.publishedAt).toLocaleDateString()} · ${p.tags.map(esc).join(", ")}</p>
          ${p.body ?? `<p>${esc(p.excerpt)}</p>`}
          <h3>${p.comments.length} comment${p.comments.length === 1 ? "" : "s"}</h3>
          ${p.comments.map((c) => `<p><strong>${esc(c.name)}</strong>: ${esc(c.body)}</p>`).join("")}
          <form data-post="${p.id}">
            <input name="name" placeholder="Name" required>
            <textarea name="body" placeholder="Say something nice" required></textarea>
            <button>Comment</button><span class="error"></span>
          </form>
        </article>`).join("");
    }

    $("posts").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target, out = form.querySelector(".error");
      try {
        await zero.comments.create({ postId: Number(form.dataset.post), name: form.name.value, body: form.body.value });
        form.reset();
        out.textContent = "Thanks! Your comment shows up once it's approved.";
      } catch (err) {
        out.textContent = err instanceof ZeroError ? err.detail : "Couldn't reach the server.";
      }
    });

    render().catch((err) => { $("posts").innerHTML = `<p class="error">${esc(err.detail ?? err.message)}</p>`; });
  </script>
</body>
</html>
