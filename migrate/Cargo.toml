[package]
name = "typedpress-migrate"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT AND GPL-2.0-or-later"

[dependencies]
typedpress = { path = "..", default-features = false }
indexmap = "2.14.2"
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_semantic = "=0.158.0"
oxc_span = "=0.158.0"
oxc_transformer = "=0.158.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
