# The SpacePress Admin workspace. Every @wordpress/* version is set once here;
# manifests say `catalog:`. See docs/admin.md for the build and provenance contract.

packages:
  - '.'
  - 'routes/*'
  - 'fields/**/*'
  - 'packages/*'
  - 'dashboard-widgets/*'

linkWorkspacePackages: true

publicHoistPattern:
  - '@wordpress/*'

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
  - fs-ext-extra-prebuilt
  - core-js
  - core-js-pure
  - protobufjs

verifyDepsBeforeRun: false

