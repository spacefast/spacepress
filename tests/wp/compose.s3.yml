# Intentionally tracked credentials are disposable, isolated to this test project, never reused.
services:
  garage:
    image: dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    command: ["/garage", "server"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 1s
      retries: 60
  wordpress:
    environment: &uploads
      TP_TEST_UPLOAD_KEY: GK111111111111111111111111
      TP_TEST_UPLOAD_SECRET: "1111111111111111111111111111111111111111111111111111111111111111"
      TP_TEST_UPLOAD_ENDPOINT: http://garage:3900
  cli:
    environment: *uploads
  replica:
    image: ${TP_WP_IMAGE:-wordpress:beta-7.2-beta5-php8.5-apache}
    environment:
      <<: *uploads
      APACHE_RUN_USER: "#${TP_WP_UID:-1000}"
      APACHE_RUN_GROUP: "#${TP_WP_GID:-1000}"
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: typedpress-test-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('TP_IDENTITY_DEV_HTTP', true);
    profiles: [replica]
    ports:
      - "${TP_WP_REPLICA_PORT:-8791}:80"
    volumes:
      - replica:/var/www/html
      - ./php/zz-typedpress-tests.ini:/usr/local/etc/php/conf.d/zz-typedpress-tests.ini:ro
      - ./apache/zz-typedpress-tests.conf:/etc/apache2/conf-enabled/zz-typedpress-tests.conf:ro
      - ${TP_WP_CONTENT:-./empty-wp-content}/plugins:/var/www/html/wp-content/plugins
volumes:
  garage:
  replica:
