# Disposable WordPress for TypedPress's WP-target tests. Not for production use.
# The DB credentials below are throwaway values for this local container only.
name: ${TP_WP_PROJECT:-typedpress-wp-test}
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: typedpress-test-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: typedpress-test-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      retries: 60
    tmpfs:
      - /var/lib/mysql
  wordpress:
    image: ${TP_WP_IMAGE:-wordpress:7.1.0-php8.5-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_RUN_USER: "#${TP_WP_UID:-1000}"
      APACHE_RUN_GROUP: "#${TP_WP_GID:-1000}"
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: typedpress-test-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('TP_IDENTITY_DEV_HTTP', true);
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-includes/version.php') && @fsockopen('127.0.0.1',80) ? 0 : 1);"]
      interval: 1s
      retries: 120
    # Webhook tests deliver to a receiver the test starts on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TP_WP_PORT:-8790}:80"
    volumes:
      - wp:/var/www/html
      - ./cache:/typedpress-cache:ro
      - ./mu-plugins:/typedpress-mu-plugins:ro
      - ./php/zz-typedpress-tests.ini:/usr/local/etc/php/conf.d/zz-typedpress-tests.ini:ro
      - ./apache/zz-typedpress-tests.conf:/etc/apache2/conf-enabled/zz-typedpress-tests.conf:ro
      - ${TP_WP_CONTENT:-./empty-wp-content}/plugins:/var/www/html/wp-content/plugins
  # WP-CLI, kept running so `harness.sh wp` is an exec, not a container start.
  cli:
    image: wordpress:cli-php8.5
    user: "${TP_WP_UID:-1000}:${TP_WP_GID:-1000}"
    depends_on: [wordpress]
    command: ["sleep", "infinity"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: typedpress-test-db
      WORDPRESS_DB_NAME: wordpress
      # wp-config evaluates this per process, so WP-CLI needs the same constants as the web server.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('TP_IDENTITY_DEV_HTTP', true);
    volumes:
      - wp:/var/www/html
      - ./cache:/typedpress-cache:ro
      - ./mu-plugins:/typedpress-mu-plugins:ro
      - ./php/zz-typedpress-tests.ini:/usr/local/etc/php/conf.d/zz-typedpress-tests.ini:ro
      - ${TP_WP_CONTENT:-./empty-wp-content}/plugins:/var/www/html/wp-content/plugins
volumes:
  wp:
